version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      angular:
        patterns:
          - '@angular/*'
          - '@angular-devkit/*'
          - 'ng-packagr'
      tooling:
        patterns:
          - '*'
        exclude-patterns:
          - '@angular/*'
          - '@angular-devkit/*'
          - 'ng-packagr'
    ignore:
      # Angular's compiler supports one TypeScript minor at a time (>=6.0 <6.1 for
      # Angular 22), so TypeScript moves with Angular updates (ng update), never alone.
      - dependency-name: typescript
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      # Types for the Node version in .nvmrc, not the newest Node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
