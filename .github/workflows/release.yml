name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

jobs:
  release:
    name: Version or publish
    # Forks never publish.
    if: github.repository == 'needless-ui/needless-ui'
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit versions and push tags
      pull-requests: write # open the "release packages" PR
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # With pending changesets this opens a "release packages" PR; once that PR
      # is merged it publishes every package whose version is not on npm yet.
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          commit-message: 'chore: release packages'
          pr-title: 'chore: release packages'
        env:
          NPM_CONFIG_PROVENANCE: 'true'
