packages:
  - packages/*
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
overrides:
  # @angular/build 22.2 pins vite 8.3.0, whose dev server has known advisories
  # (GHSA-r825-w8mm-5pxw and others, fixed in 8.3.3). Drop this once Angular moves on.
  vite@8.3.0: 8.3.5
minimumReleaseAgeExclude:
  - '@angular-devkit/architect@0.2202.0'
  - '@angular-devkit/core@22.2.0'
  - '@angular-devkit/schematics@22.2.0'
  - '@angular/cli@22.2.0'
  - '@angular/common@22.2.0'
  - '@angular/compiler-cli@22.2.0'
  - '@angular/compiler@22.2.0'
  - '@angular/core@22.2.0'
  - '@angular/forms@22.2.0'
  - '@angular/platform-browser@22.2.0'
  - '@angular/router@22.2.0'
  - '@schematics/angular@22.2.0'
  - '@angular/build@22.2.0'
  - '@angular/platform-server@22.2.0'
  - '@angular/ssr@22.2.0'
  - '@angular/aria@22.2.0'
  - '@angular/cdk@22.2.0'
