<nui-scheduler
  [events]="bookings()"
  [resources]="rooms"
  view="timeline"
  [views]="['timeline', 'day']"
  dayStart="8"
  dayEnd="19"
  snapMinutes="15"
  editable
  selectable
  [allow]="free"
  (eventChange)="move($event)"
  (slotSelect)="book($event)"
>
  <ng-template nuiSchedulerResource let-room>
    <span class="room-name">{{ room.title }}</span>
    <span class="room-seats" dir="auto">{{ seats(room) }} seats</span>
  </ng-template>
  <ng-template nuiSchedulerEvent let-event let-time="time">
    <span class="booking-title">{{ event.title }}</span>
    <span class="booking-host">{{ host(event) }} · {{ time }}</span>
  </ng-template>
</nui-scheduler>
<p>{{ note() }}</p>
