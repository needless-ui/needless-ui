<div class="app">
  <div class="toolbar">
    <button #create nuiButton size="sm">New note</button>
    <input
      #search
      type="search"
      class="search"
      placeholder="Search notes"
      aria-label="Search notes"
    />
    <button #share nuiButton size="sm" variant="outline" tone="neutral">Share</button>
  </div>
  <p class="muted">Your notes appear here.</p>
</div>
<button nuiButton variant="soft" (click)="outcome.set(''); touring.set(true)">Take the tour</button>
@if (outcome()) {
  <p>{{ outcome() }}</p>
}
<nui-tour
  [steps]="steps"
  [(open)]="touring"
  (finished)="outcome.set('Tour finished.')"
  (dismissed)="outcome.set('Tour ended on step ' + ($event + 1) + '.')"
/>
