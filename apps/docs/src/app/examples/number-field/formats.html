<div nuiNumberField>
  <input
    nuiNumberInput
    style="inline-size: 14ch"
    aria-label="Price in euros"
    locale="de-DE"
    [min]="0"
    [step]="0.01"
    [format]="{ style: 'currency', currency: 'EUR' }"
    [(value)]="price"
  />
</div>
<div nuiNumberField>
  <button nuiNumberStep="-1"></button>
  <input
    nuiNumberInput
    aria-label="Discount"
    [min]="0"
    [max]="1"
    [step]="0.05"
    [format]="{ style: 'percent' }"
    [(value)]="discount"
  />
  <button nuiNumberStep="1"></button>
</div>
<p>Value: {{ price() }} · {{ discount() }}</p>
