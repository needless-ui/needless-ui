<div class="fields">
  <label class="field wide">
    <span
      >Card number
      @if (brand(); as b) {
        <span class="card-brand">{{ b.name }}</span>
      }
    </span>
    <input
      [nuiMask]="cardMask"
      unmask
      autocomplete="cc-number"
      placeholder="1234 1234 1234 1234"
      [formField]="fields.card"
      [attr.aria-invalid]="fields.card().invalid() || null"
    />
  </label>
  <label class="field">
    <span>Expiry</span>
    <input nuiMask="00/00" autocomplete="cc-exp" placeholder="MM/YY" [formField]="fields.expiry" />
  </label>
  <label class="field">
    <span>Security code</span>
    <input
      [nuiMask]="codeMask()"
      autocomplete="cc-csc"
      [placeholder]="codeHint()"
      [formField]="fields.code"
    />
  </label>
  <label class="field wide">
    <span>IBAN</span>
    <input
      [nuiMask]="ibanMask"
      unmask
      placeholder="IT60 X054 2811 1010 0000 0123 456"
      [formField]="fields.iban"
      [attr.aria-invalid]="fields.iban().invalid() || null"
    />
  </label>
</div>
@for (error of errors(); track error.kind) {
  <p class="error">{{ error.message }}</p>
}
<p>Card: {{ payment().card || '—' }} · IBAN: {{ payment().iban || '—' }}</p>
